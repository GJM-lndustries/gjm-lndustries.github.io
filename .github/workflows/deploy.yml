name: Desplegar en GitHub Pages

# Compila y prueba en cada PR y push a main. Además publica en GitHub Pages desde main,
# salvo que se desactive. Para desactivar el despliegue a GitHub Pages (por ejemplo, al usar
# Cloudflare Pages) hay dos opciones:
#   1. Crear la variable de repositorio DEPLOY_GITHUB_PAGES = false
#      (Settings → Secrets and variables → Actions → Variables), sin tocar este archivo; o
#   2. Cambiar la línea `DEPLOY_GITHUB_PAGES` de `env` (abajo) a 'false'.
# El job `build` sigue corriendo como verificación.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_GITHUB_PAGES: ${{ vars.DEPLOY_GITHUB_PAGES || 'true' }}

permissions:
  contents: read
  pages: write
  id-token: write

# Solo un despliegue a la vez; no cancela uno que ya esté en curso.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.flag.outputs.deploy }}
    steps:
      - name: ¿Desplegar en GitHub Pages?
        id: flag
        run: echo "deploy=${{ env.DEPLOY_GITHUB_PAGES }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Revisar tipos
        run: pnpm check

      - name: Validar banco de preguntas
        run: pnpm validate:questions

      - name: Pruebas
        run: pnpm test

      - name: Compilar
        run: pnpm build

      - name: Configurar Pages
        if: github.event_name != 'pull_request' && env.DEPLOY_GITHUB_PAGES == 'true'
        uses: actions/configure-pages@v6

      - name: Subir artefacto
        if: github.event_name != 'pull_request' && env.DEPLOY_GITHUB_PAGES == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # Solo despliega desde main (los PR solo compilan y prueban) y si no está desactivado.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.deploy == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v5
